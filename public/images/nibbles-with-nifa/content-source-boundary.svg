<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title description">
  <title id="title">Nibbles content-source boundary</title>
  <desc id="description">Diagram showing the production Sanity source passing through published and ready filters into public Next.js routes, while local demo content is limited to development and rejected in production.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c63b18"/>
    </marker>
    <style>
      .eyebrow { font: 700 16px Arial, sans-serif; letter-spacing: 3px; fill: #a52e12; }
      .title { font: 700 52px Arial, sans-serif; letter-spacing: -2px; fill: #171714; }
      .subtitle { font: 400 22px Arial, sans-serif; fill: #625e56; }
      .box-title { font: 700 24px Arial, sans-serif; fill: #171714; }
      .body { font: 400 18px Arial, sans-serif; fill: #625e56; }
      .small { font: 700 14px Arial, sans-serif; letter-spacing: 1.5px; fill: #a52e12; }
      .box { fill: #fbf8f0; stroke: #b8b0a2; stroke-width: 2; }
      .accent { fill: #f4d7c9; stroke: #c63b18; stroke-width: 2; }
      .line { stroke: #c63b18; stroke-width: 3; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1440" height="900" fill="#f3efe5"/>
  <text x="80" y="70" class="eyebrow">REPOSITORY EVIDENCE · CONTENT DELIVERY</text>
  <text x="80" y="140" class="title">Make the content source explicit.</text>
  <text x="80" y="182" class="subtitle">Development fixtures and public content share renderers, not trust.</text>
  <line x1="80" y1="222" x2="1360" y2="222" stroke="#b8b0a2" stroke-width="2"/>

  <rect x="80" y="282" width="330" height="198" rx="6" class="box"/>
  <text x="110" y="322" class="small">PRODUCTION DEFAULT</text>
  <text x="110" y="366" class="box-title">Sanity content</text>
  <text x="110" y="404" class="body">Published perspective</text>
  <text x="110" y="436" class="body">60-second revalidation</text>

  <path d="M 410 381 L 535 381" class="line"/>

  <rect x="555" y="282" width="370" height="198" rx="6" class="accent"/>
  <text x="585" y="322" class="small">CONTENT STORE</text>
  <text x="585" y="366" class="box-title">Public filters</text>
  <text x="585" y="404" class="body">Exclude draft document IDs</text>
  <text x="585" y="436" class="body">Recipes require stage: ready</text>

  <path d="M 925 381 L 1010 381" class="line"/>

  <rect x="1030" y="282" width="330" height="198" rx="6" class="box"/>
  <text x="1060" y="322" class="small">PUBLIC OUTPUT</text>
  <text x="1060" y="366" class="box-title">Next.js routes</text>
  <text x="1060" y="404" class="body">Recipes and travel essays</text>
  <text x="1060" y="436" class="body">Only intentional publication</text>

  <rect x="555" y="535" width="805" height="118" rx="6" class="box"/>
  <text x="585" y="576" class="small">FAIL-CLOSED BEHAVIOUR</text>
  <text x="585" y="618" class="box-title">Provider failure or empty collection stays visible.</text>
  <text x="585" y="642" class="body">No sample-content substitution</text>

  <rect x="80" y="708" width="1280" height="116" rx="6" fill="#171714"/>
  <text x="110" y="750" font-family="Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="1.5" fill="#f28b61">LOCAL DEVELOPMENT LANE</text>
  <text x="110" y="792" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#f3efe5">CONTENT_SOURCE=demo</text>
  <path d="M 410 780 L 590 780" class="line"/>
  <text x="620" y="788" font-family="Arial, sans-serif" font-size="20" fill="#d7d0c4">Same page renderers</text>
  <path d="M 870 780 L 1010 780" class="line"/>
  <text x="1040" y="770" font-family="Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="1.2" fill="#f28b61">PRODUCTION GUARD</text>
  <text x="1040" y="800" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#f3efe5">Demo source rejected</text>
</svg>
